name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Pull requests build but do not deploy, so a broken build is caught in
  # review rather than after it has already merged and published.
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Serves assets from /Portfolio/ instead of the domain root.
          GITHUB_PAGES: 'true'

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a hard load of /Portfolio/about would
        # 404. Serving index.html as the 404 page hands those URLs to the
        # client-side router instead.
        run: cp dist/index.html dist/404.html

      # Pages-specific steps are skipped on pull requests — the build above is
      # the whole point there, and configure-pages fails when Pages is not
      # enabled for the branch.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          # Turns Pages on via the API if it is not already enabled, instead of
          # failing with "Get Pages site failed. Not Found" and requiring
          # someone to flip the setting by hand. No-op once Pages exists.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
